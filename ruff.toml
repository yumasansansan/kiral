#
# The rules of the Python of the repository, which is scripts/ alone: those of
# JPEG-Unround's Python, lines of up to 120 columns as in the Rust.
line-length = 120
target-version = "py314"
src = ["scripts"]

[lint]
select = [
  "A", "ANN", "ARG", "B", "BLE", "C4", "E", "ERA", "F", "FBT", "FURB", "I", "N", "PERF",
  "PL", "PTH", "RET", "RUF", "S", "SIM", "T20", "TRY", "UP", "W",
]
ignore = [
  "TRY003",  # an exception says what went wrong where it is raised
]

# Command-line programs print, and compare with the numbers of the formats and
# of the rules of their task.
[lint.per-file-ignores]
"scripts/**" = ["T201", "PLR2004"]
