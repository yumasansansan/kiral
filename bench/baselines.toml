#
# The numbers that KIRAL's conversions are compared with, on AJIMEE-Bench
# JWTD_v2/v1: 200 readings, 100 of them with left context. `accuracy` is Acc@1
# and `cer` the character error rate, both in percent; `kiral-tools eval`
# measures them, and keeps each run's conversions in bench/results/, which is
# not committed, for the next run to be compared with item by item.
#
# `replay` keeps the time an input method takes for each key of AJIMEE-Bench's
# readings typed in romaji, and for each conversion with Space, in milliseconds:
# the median and the 99th percentile, by the nearest rank, on one pinned core,
# with the median of the clock read while it ran. For KIRAL's engine, a kana
# every 100 ms, it keeps besides the time from a key to its refinement, of the
# keys whose refinement came before the next, and the worker's core and clock.
#
# `kernels` keeps the multiply-adds a second, in billions, of the products in
# integers of zenz's five layers (`kiral-tools bench kernels`), their weights in
# the caches: the least and the most over the layers and the runs, for each
# number of rows and each form.
#
# `agree` keeps how many of the positions of single precision's conversions of
# AJIMEE-Bench's items have, in a quantized model, the likeliest next token that
# single precision has there (`kiral-tools agree`), and `model` the time zenz
# takes for a prompt fed at once and for each step of decoding, in
# milliseconds, as `replay` gives them (`kiral-tools bench model`). `load` keeps
# the time to load zenz, ten loads anew, each followed by the first item's
# prompt fed twice, in milliseconds (`kiral-tools bench load`).
#
# The rows of `kiral-tools eval` are measured by the same harness as KIRAL's
# own conversions will be. The rows of `earlier` were measured in October 2026,
# before this repository, by a harness of their own: their accuracies agree with
# this harness's within an item, and their character error rates were not
# reproduced by it.

